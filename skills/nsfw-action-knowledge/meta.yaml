desc-cn: 結構化的 NSFW 可見身體動作參考，涵蓋手部接觸、口部動作、身體摩擦、插入抽插、騎乘、深喉、肛交、道具、高潮、組合模板、姿勢補充與節奏力度詞彙。格式原則：角色 + 動詞 + 目標部位 + 細節修飾。適用於撰寫包含親密身體動作的提示詞、分鏡或訓練資料。與 h3-prompt-writing 搭配可強化 MiniMax H3 影片生成的動作描述。
